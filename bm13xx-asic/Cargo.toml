[package]
categories = ["embedded", "no-std"]
description = "Registers, PLL, core topology and the Asic trait shared by the Bitmain BM13xx Bitcoin mining ASIC drivers"
edition = "2021"
keywords = ["bitcoin", "mining", "asic", "bitmain", "embedded"]
license = "MIT OR Apache-2.0"
name = "bm13xx-asic"
readme = "../README.md"
repository = "https://github.com/GPTechinno/bm13xx-rs"
rust-version = "1.87.0"
version = "0.4.0"

[dependencies]
bm13xx-protocol = { path = "../bm13xx-protocol", version = "0.4.0" }

defmt = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["from"] }
fugit = { workspace = true }
log = { workspace = true, optional = true }

[features]
defmt = ["dep:defmt", "bm13xx-protocol/defmt", "fugit/defmt"]
