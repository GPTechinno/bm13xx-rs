[package]
categories = ["embedded", "no-std"]
description = "Async driver for a chain of Bitmain BM13xx Bitcoin mining ASICs"
edition = "2021"
keywords = ["bitcoin", "mining", "asic", "bitmain", "embedded"]
license = "MIT OR Apache-2.0"
name = "bm13xx-chain"
readme = "README.md"
repository = "https://github.com/GPTechinno/bm13xx-rs"
rust-version = "1.87.0"
version = "0.4.1"

[dependencies]
bm13xx-asic = { path = "../bm13xx-asic", version = "0.4.0" }
bm13xx-protocol = { path = "../bm13xx-protocol", version = "0.4.0" }

defmt = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["from"] }
embedded-hal = { workspace = true }
embedded-hal-async = { workspace = true }
embedded-io-async = { workspace = true }
fugit = { workspace = true }
heapless = { workspace = true }
log = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[features]
# check each nonce against the job it was found for, counting hardware errors per chip
nonce-check = ["dep:sha2"]
defmt = [
    "dep:defmt",
    "bm13xx-asic/defmt",
    "bm13xx-protocol/defmt",
    "embedded-hal/defmt-03",
    "embedded-hal-async/defmt-03",
    "embedded-io-async/defmt",
    "fugit/defmt",
    "heapless/defmt",
]

[dev-dependencies]
bm1366 = { path = "../bm1366" }
sha2 = { workspace = true }

embedded-io = { version = "0.7", features = ["std"] }
env_logger = "0.11"
inquire = "0.9"
linux-embedded-hal = "0.5"
tokio = { version = "1.54", features = ["macros", "time", "rt-multi-thread"] }
tokio-serial = "5.5"

[[example]]
name = "bm13xx-cli"
path = "examples/cli.rs"
