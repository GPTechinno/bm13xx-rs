name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Rust
        uses: actions/checkout@v7
      - uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libudev-dev
          version: 1.0
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --verbose -- -D warnings
      - name: Test nonce-check
        run: cargo test --verbose -p bm13xx-chain --features nonce-check
      - name: Clippy nonce-check
        run: cargo clippy --verbose -p bm13xx-chain --all-targets --features nonce-check -- -D warnings
      - name: Clippy log
        run: cargo clippy --verbose --workspace --features log -- -D warnings
      - name: Clippy defmt
        run: cargo clippy --verbose --workspace --features defmt -- -D warnings
      # - name: Audit
      #   run: cargo audit
