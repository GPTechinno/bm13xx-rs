[package]
categories = ["embedded", "no-std"]
description = "Driver for the Bitmain BM1397 Bitcoin mining ASIC"
edition = "2021"
keywords = ["bitcoin", "mining", "asic", "bitmain", "embedded"]
license = "MIT OR Apache-2.0"
name = "bm1397"
readme = "../README.md"
repository = "https://github.com/GPTechinno/bm13xx-rs"
rust-version = "1.87.0"
version = "0.4.0"

[dependencies]
"bm13xx-asic" = { path = "../bm13xx-asic", version = "0.4.0" }
"bm13xx-protocol" = { path = "../bm13xx-protocol", version = "0.4.0" }

defmt = { workspace = true, optional = true }
fugit = { workspace = true }
heapless = { workspace = true }
log = { workspace = true, optional = true }

[features]
defmt = [
    "dep:defmt",
    "bm13xx-asic/defmt",
    "bm13xx-protocol/defmt",
    "fugit/defmt",
    "heapless/defmt",
]
